name: Backend Quality

on:
  push:
    branches: [main]
    paths:
      - 'backend_nodejs/**'
      - '.github/workflows/backend-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend_nodejs/**'
      - '.github/workflows/backend-quality.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_nodejs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend_nodejs/package-lock.json
      - run: npm ci
      - run: npm run test:unit
