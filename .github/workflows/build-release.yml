name: Build Release APK

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Secrets cannot be referenced in `if:` — expose as env first.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Criar local.properties
        run: |
          # No leading spaces — Properties loader is whitespace-sensitive
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT}"
            echo "CLAUDE_API_KEY=${CLAUDE_API_KEY}"
            echo "DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
            echo "ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}"
            echo "ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}"
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_KEY=${SUPABASE_KEY}"
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
            echo "GROQ_API_KEY=${GROQ_API_KEY}"
            echo "CARTESIA_API_KEY=${CARTESIA_API_KEY}"
            echo "BACKEND_URL=${BACKEND_URL:-https://eliasaitutor2.onrender.com}"
            echo "KEYSTORE_FILE=elias-release-key.jks"
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
            echo "KEY_ALIAS=${KEY_ALIAS:-elias-key}"
            echo "KEY_PASSWORD=${KEY_PASSWORD}"
          } > local.properties

      # Optional signed release when KEYSTORE_BASE64 secret is set
      - name: Decodificar keystore de release (opcional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > elias-release-key.jks
          ls -la elias-release-key.jks

      - name: Permissão de execução no gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 30
