name: Build Release APK

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Secrets cannot be referenced in `if:` — expose as env first.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      # No secret here legitimately contains a line break, but a value piped
      # into `gh secret set` from a shell carries a trailing newline, and one
      # pasted from a Windows terminal can carry a CR. Both paths break:
      # build.gradle.kts prefers System.getenv over local.properties, and
      # buildConfigField injects the value verbatim into a string literal, so a
      # newline produces an unterminated literal and the Kotlin build fails. For
      # the signing secrets the same CR reaches keystore decryption and reads as
      # a wrong password. Normalizing once, before anything consumes them,
      # covers every consumer downstream.
      - name: Normalizar segredos
        run: |
          for name in CLAUDE_API_KEY DEEPSEEK_API_KEY OPENAI_API_KEY \
                      ELEVENLABS_API_KEY ELEVENLABS_VOICE_ID \
                      SUPABASE_URL SUPABASE_KEY GEMINI_API_KEY GROQ_API_KEY \
                      CARTESIA_API_KEY BACKEND_URL \
                      KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            printf '%s=%s\n' "$name" "$(printf '%s' "${!name}" | tr -d '\r\n')"
          done >> "$GITHUB_ENV"

      - name: Criar local.properties
        run: |
          # No leading spaces — Properties loader is whitespace-sensitive
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT}"
            echo "CLAUDE_API_KEY=${CLAUDE_API_KEY}"
            echo "DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
            echo "ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}"
            echo "ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}"
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_KEY=${SUPABASE_KEY}"
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
            echo "GROQ_API_KEY=${GROQ_API_KEY}"
            echo "CARTESIA_API_KEY=${CARTESIA_API_KEY}"
            echo "BACKEND_URL=${BACKEND_URL:-https://eliasaitutor2.onrender.com}"
            echo "KEYSTORE_FILE=elias-release-key.jks"
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
            echo "KEY_ALIAS=${KEY_ALIAS:-elias-key}"
            echo "KEY_PASSWORD=${KEY_PASSWORD}"
          } > local.properties

      # Optional signed release when KEYSTORE_BASE64 secret is set
      - name: Decodificar keystore de release (opcional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > elias-release-key.jks
          ls -la elias-release-key.jks

      # Fail in seconds with a named cause instead of 4 minutes of Gradle
      # stacktrace. Never echoes any password value.
      - name: Validar keystore, alias e senhas
        if: env.KEYSTORE_BASE64 != ''
        run: |
          KS=elias-release-key.jks
          # Same default build.gradle.kts applies, so the check tests what
          # Gradle will actually use rather than an empty alias.
          KEY_ALIAS="${KEY_ALIAS:-elias-key}"
          fail() { echo "::error::$1"; exit 1; }

          [ -s "$KS" ] || fail "Keystore vazio ou ausente apos decodificar KEYSTORE_BASE64."
          [ -n "$KEYSTORE_PASSWORD" ] || fail "Secret KEYSTORE_PASSWORD nao esta definido."
          [ -n "$KEY_PASSWORD" ] || fail "Secret KEY_PASSWORD nao esta definido."

          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            fail "KEYSTORE_PASSWORD nao abre o keystore. Os bytes do .jks estao integros; a senha do store e que nao confere."
          fi
          echo "Senha do store: OK"

          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "Aliases presentes no keystore:"
            keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -i 'PrivateKeyEntry\|trustedCertEntry' || true
            fail "KEY_ALIAS nao existe neste keystore."
          fi
          echo "Alias: OK"

          # Reads the private key with KEY_PASSWORD into a throwaway store.
          # Non-destructive: the source keystore is only read.
          if ! keytool -importkeystore -noprompt \
                 -srckeystore "$KS" -srcstorepass "$KEYSTORE_PASSWORD" \
                 -srcalias "$KEY_ALIAS" -srckeypass "$KEY_PASSWORD" \
                 -destkeystore "$RUNNER_TEMP/probe.p12" -deststoretype PKCS12 \
                 -deststorepass probe-only-not-a-secret \
                 -destkeypass probe-only-not-a-secret >/dev/null 2>&1; then
            fail "KEY_PASSWORD nao abre a chave privada do alias."
          fi
          rm -f "$RUNNER_TEMP/probe.p12"
          echo "Senha da chave: OK"

          # Printed in the same shape apksigner uses (lowercase, no colons),
          # so the two outputs can be compared character by character.
          FP=$(keytool -list -v -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
               | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "SHA-256 do certificado que vai assinar esta APK: $FP"

      - name: Permissão de execução no gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # Makes every release build declare, in the CI log, which certificate
      # actually signed it. Catches the silent fallback to the debug keystore.
      - name: Verificar assinatura da APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::Nenhuma APK encontrada em app/build/outputs/apk/release."; exit 1; }
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner nao encontrado no Android SDK."; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK"

          # Hard-fail only when a release keystore was supposed to be used.
          # Without KEYSTORE_BASE64 the debug fallback is the documented
          # behaviour of build.gradle.kts, so failing there would turn every
          # push to main red for anyone without the secret.
          if "$APKSIGNER" verify --print-certs "$APK" | grep -q 'CN=Android Debug'; then
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "::error::KEYSTORE_BASE64 esta definido, mas a APK saiu assinada com o keystore de DEBUG."
              exit 1
            fi
            echo "::warning::APK assinada com o keystore de debug (KEYSTORE_BASE64 nao definido). Nao distribua esta APK."
          fi

      - name: Upload APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 30
